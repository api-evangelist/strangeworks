  surface: products
  fields: [backendCreate, backendUpdate, backendDelete, backendAddTypes, backendRemoveTypes, jobCreate, jobUpdate, touchJob, jobUploadFile, billingTransactionCreate, resourceUpdateStatus, resourceStoreConfiguration, resourceResetConfiguration, requestBillingApproval]
  note: >-
    The products API is the PROVIDER side of the platform — it is how a compute product
    writes job state back. A workspace API key does not reach it; it needs a product key.
    This is the single largest surface divergence in the platform.
surface_divergence:
  - The sdk schema is a deliberate 3-query/4-mutation subset of platform, scoped to what an SDK user needs.
  - The products schema is a different audience entirely (product/provider keys), not a subset of either.
  - jobCreate exists ONLY on products; a workspace user creates jobs indirectly by calling a resource through the REST proxy.
  - resourceCreate exists on BOTH platform and products with different inputs.
  - The REST proxy is untyped and product-defined and therefore has no crosswalk row at all.
