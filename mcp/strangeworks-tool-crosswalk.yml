source: >-
  Derived by binding each candidate MCP tool in mcp/strangeworks-mcp.yml to the real
  GraphQL field that backs it, across the three live schemas captured in graphql/.
purpose: >-
  Strangeworks has no OpenAPI and no MCP server, so the usual REST<->MCP crosswalk does
  not apply. What it does have is THREE overlapping-but-non-identical GraphQL projections
  of one data core (sdk, platform, products) plus an untyped REST proxy. This file records
  that divergence: which capability is reachable from which surface, so nothing is silently
  dropped. Every binding names a field that exists verbatim in the captured SDL.
surfaces:
  openapi: null   # none published; probed /openapi.json, /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /docs, /redoc -> all 404
  graphql:
  - {name: sdk, endpoint: 'https://api.strangeworks.com/sdk', introspection: open-anonymous, queries: 3, mutations: 4, types: 100}
  - {name: platform, endpoint: 'https://api.strangeworks.com/platform', introspection: open-anonymous, queries: 11, mutations: 56, types: 191}
  - {name: products, endpoint: 'https://api.strangeworks.com/products', introspection: open-anonymous, queries: 7, mutations: 19, types: 134}
  rest_proxy:
    pattern: https://api.strangeworks.com/products/{product_slug}/resource/{resource_slug}/{path}
    typed: false
    note: >-
      Product-defined passthrough. There is no fixed operation set, so no operation here
      can be crosswalked — this is a real, uncatalogable surface, not an omission.
  mcp: null   # no MCP server published; tools below are candidates
