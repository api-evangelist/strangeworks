  /.well-known/oauth-protected-resource or oauth-authorization-server on any host (all
  404), which is what a hosted MCP server would advertise. The tool set below is a
  CANDIDATE derived from the live GraphQL schemas: every tool binds to a real, named
  query or mutation, so each one's input contract is that field's real argument list. It
  is a proposal for what a Strangeworks MCP server would expose, not a claim that one
  exists. No fabricated tools.
