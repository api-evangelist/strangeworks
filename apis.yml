aid: strangeworks
name: Strangeworks
description: 'Strangeworks is an Austin, Texas based optimization and quantum computing
  company founded in 2018 by whurley (William Hurley). It operates a "heterogeneous
  hybrid compute" platform that gives enterprises and governments managed access to
  quantum processors, quantum-inspired annealers and classical optimization solvers
  from a single API and Python SDK, alongside its Compute, Workflows, Decisions and
  HybridSolver products and an expert services practice. The platform is organized
  around workspaces, products, resources, jobs and backends, and is programmable through
  three public GraphQL endpoints (sdk, platform, products) at api.strangeworks.com
  plus a REST proxy that forwards calls to an activated resource. Compute partners
  reachable through the platform include IBM Quantum, Amazon Braket, Azure Quantum,
  IonQ, Rigetti, Quantinuum, QuEra, IQM, AQT, Pasqal, D-Wave, Toshiba, Hitachi, Fujitsu,
  NEC, Gurobi, JIJ, LightSolver and Quantagonia (acquired 2025).'
