apis:
- aid: strangeworks:sdk
  name: Strangeworks SDK GraphQL API
  description: The GraphQL API the Strangeworks Python SDK is built on. Exposes the
    workspace a user's API key belongs to, the compute backends available to it, and
    mutations for uploading workspace files, initiating and finalizing batch jobs,
    and tagging jobs. Authenticated with a JWT bearer token exchanged from a workspace
    API key at POST /users/token.
  humanURL: https://docs.strangeworks.com/strangeworks-python
  baseURL: https://api.strangeworks.com/sdk
  tags:
  - GraphQL
  - Quantum Computing
  - Jobs
  - Workspaces
  properties:
  - type: GraphQL
    url: graphql/strangeworks-sdk.graphql
  - type: Documentation
    url: https://docs.strangeworks.com/strangeworks-python
- aid: strangeworks:platform
  name: Strangeworks Platform GraphQL API
  description: The full Strangeworks platform GraphQL API covering user accounts, workspaces
    and members, invitations, billing accounts, credits and transactions, products
    and the product catalog, resources, jobs, files, web links and event subscriptions
    (webhooks). 11 queries and 56 mutations.
  humanURL: https://docs.strangeworks.com/welcome/how-it-works
  baseURL: https://api.strangeworks.com/platform
  tags:
  - GraphQL
  - Workspaces
  - Billing
  - Jobs
  - Webhooks
  properties:
  - type: GraphQL
    url: graphql/strangeworks-platform.graphql
  - type: Webhooks
    url: asyncapi/strangeworks-webhooks.yml
  - type: Documentation
    url: https://docs.strangeworks.com/welcome/how-it-works
- aid: strangeworks:products
  name: Strangeworks Products GraphQL API
  description: The product-side GraphQL API used by compute products published on the
    Strangeworks platform to register and update backends, create and update jobs,
    upload job files, store resource configuration, and create billing transactions.
    Authenticated with a product API key exchanged at POST /product/token.
  humanURL: https://docs.strangeworks.com/welcome/how-it-works
  baseURL: https://api.strangeworks.com/products
  tags:
  - GraphQL
  - Backends
  - Jobs
  - Billing
  properties:
  - type: GraphQL
    url: graphql/strangeworks-products.graphql
  - type: Documentation
    url: https://docs.strangeworks.com/welcome/how-it-works
